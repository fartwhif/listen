; Platform supervision. PID 1 = supervisord, so orphans are reaped (a forked
; library child cannot become a zombie the way it did in CatWatch's PID-1 node).
; Per-partition programs are generated into conf.d/ by platform/gen-conf.sh,
; which the watchdog re-runs when partitions.json changes.
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
childlogdir=/var/log/sup

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files=/etc/supervisor/conf.d/*.conf
