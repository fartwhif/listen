# Gateway: the stack's only gated listener (container :80, i.e. the WG peer
# IP every VPS server_name already proxies to).
#
# Path contract (scheme A: one door, partition = path):
#   /                    partition picker (public)
#   /login /pair         identity pages (public)
#   /api/auth/*          auth server 127.0.0.1:8099 (public by nature)
#   /health              container liveness (public)
#   /<front>/…           the front partition answers at ROOT, so every existing
#                        bookmark, car UI, vault callback and VPS server_name
#                        keeps working byte-identically
#   /l/<slug>/…          every other partition. Unknown slug = 404 (no location
#                        matches), so a typo can never borrow another
#                        partition's data.
#
# Per-partition locations and the ?pass= map are GENERATED
# (platform/gen-conf.py -> stack-locations/10-locations.conf + conf.d/05-maps.conf):
# one prefix block per slug, literal ports in every proxy_pass (no resolver, no
# runtime-variable upstreams), so adding a partition is a registry edit, not a
# rebuild or an nginx-idiom gamble.
#
# Identity: auth_request to 127.0.0.1:8099/gate/<slug>. The gate endpoint is
# internal; the subrequest inherits the parent's Cookie / Authorization headers
# and the slug travels as X-Slug. Answer 200 (+X-Partition-Slug, X-User) or 401.
#
# Two listeners deliberately sit OUTSIDE the gate because other machines reach
# them by contract, not through here: 8090 (front broadcaster: the VPS proxy
# frogrock.example.com -> peer:8090 /stream.mp3, and DNAS's relay target) and
# 8091 (the stream-fix shim DNAS relays through). They are unauthenticated
# broadcast surfaces on purpose - that is what a radio stream is.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Redirects answer with a PATH, never with an absolute URL built from the Host
    # header. nginx 1.22 (this image's base) defaults to `absolute_redirect on`,
    # which turns every `return 301/302` below into `http://<Host>/login?...`: the
    # scheme is http because nginx cannot see the VPS's TLS termination
    # (X-Forwarded-Proto is not honoured for these), and the target then depends on
    # a header the client chooses. Off keeps the client on the origin it already
    # reached - the shape the pre-hub image (nginx 1.27, where Off is the default)
    # ran in production with.
    absolute_redirect off;

    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    # ---- public identity surface -----------------------------------
    # The picker is the one page that belongs to no partition, so it is gated
    # SOFTLY: hubauth's slug-free /whoami answers 204 for a browser with no
    # session and nginx serves the page anyway (a 401 target would refuse it,
    # and an anonymous visitor MUST get the partition list, not a login wall).
    # 204/200 both allow; only the name differs, and it lands in $gate_user.
    #
    # gzip is off here because sub_filter refuses a compressed body and the
    # picker's payload placeholder (`__HUB_USER__`, written by gen-conf into
    # /var/www/hub/index.html) is exactly what this block replaces with the
    # identity. The file is ~2.6 KB, above the server's gzip_min_length of 1024,
    # so without this line the picker would ship its dock with a placeholder in
    # it (and compressed, so the failure would be invisible to a plain curl).
    location = / {
        auth_request /_whoami;
        auth_request_set $gate_user $upstream_http_x_user;
        root /var/www/hub;
        try_files /index.html =404;
        gzip off;
        sub_filter_once on;
        sub_filter __HUB_USER__ $gate_user;
        add_header Cache-Control "no-store" always;
    }
    location = /login  { root /var/www/hub; try_files /login.html  =404; add_header Cache-Control "no-store" always; }
    location = /pair   { root /var/www/hub; try_files /pair.html   =404; add_header Cache-Control "no-store" always; }
    location = /logout { root /var/www/hub; try_files /logout.html =404; add_header Cache-Control "no-store" always; }
    location = /hub.js   { root /var/www/hub; add_header Cache-Control "no-cache" always; }
    location = /api/auth/login {
        include /etc/nginx/snippets/proxy-auth.conf;
        proxy_pass http://127.0.0.1:8099/login;
    }
    location = /api/auth/logout {
        include /etc/nginx/snippets/proxy-auth.conf;
        proxy_pass http://127.0.0.1:8099/logout;
    }
    location = /api/auth/pair {
        include /etc/nginx/snippets/proxy-auth.conf;
        proxy_pass http://127.0.0.1:8099/pair;
    }
    location = /api/auth/me {
        include /etc/nginx/snippets/proxy-auth.conf;
        proxy_pass http://127.0.0.1:8099/me;
    }
    location = /api/auth/codes {
        include /etc/nginx/snippets/proxy-auth.conf;
        proxy_pass http://127.0.0.1:8099/codes;
    }
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"listen-stack"}';
    }

    # ---- portal statics (ungated: the picker tells you to log in) ---
    # hub.css styles the picker and the three auth doors; dock.css/dock.js are
    # the nav dock's own pair, referenced by the tags gen-conf puts in every
    # page's <head> (the shells, the picker, and the proxied app pages via
    # sub_filter). They are root-absolute for the same reason in all three homes:
    # a page under /l/family/grabby/ has a different <base>, and the dock is the
    # thing that reaches ACROSS mounts. no-cache so a redeploy lands immediately
    # without a version query in the generated tags.
    location = /hub.css {
        root /var/www/hub;
        add_header Cache-Control "no-cache" always;
    }
    location = /dock.css {
        root /var/www/hub;
        add_header Cache-Control "no-cache" always;
    }
    location = /dock.js {
        root /var/www/hub;
        add_header Cache-Control "no-cache" always;
    }

    # ---- gate plumbing ---------------------------------------------
    # The slug travels in the gate URI itself (/_gate/<slug>), set by each
    # partition location's literal auth_request, so no nginx variables other
    # than the captured slug are involved.
    # Quoted, because nginx's parser ends a location's pattern at the first
    # `{` outside a string: unquoted, the `{0,31}` quantifier is read as the
    # start of the block and the regex dies with "missing closing parenthesis".
    # The generated per-member progress regex quotes itself for the same reason.
    location ~ "^/_gate/(?<gs>[a-z][a-z0-9_-]{0,31})$" {
        internal;
        # $args is inherited from the parent request, so ?key= and
        # ?pass= reach the identity check.
        proxy_pass http://127.0.0.1:8099/gate/$gs$is_args$args;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        # $request_uri is the UNPARSED original request URI and is inherited by
        # the subrequest: the gate needs it to tell a stream's ?pass= allowance
        # from a ?pass= smuggled onto an api call.
        proxy_set_header X-Gate-Uri $request_uri;
    }
    # Where a gated PAGE navigation goes when the gate says 401: the login door,
    # carrying the page it came from so hubauth can send the human back there
    # after a successful login (hubauth only accepts a `next` inside the
    # partition being logged into). Generated blocks name this target.
    location = /_login-redir {
        internal;
        return 302 /login?next=$request_uri;
    }
    # The picker's soft gate: same plumbing as /_gate/ (the original URI travels
    # in X-Gate-Uri so a ?key= on the picker URL identifies the caller), but with
    # NO slug in the target, because /whoami answers for whichever partition the
    # caller's session is bound to and says nothing when there is no identity.
    location = /_whoami {
        internal;
        proxy_pass http://127.0.0.1:8099/whoami;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Gate-Uri $request_uri;
    }
    location @noauth {
        default_type application/json;
        add_header WWW-Authenticate "Bearer realm=\"listen\"" always;
        return 401 '{"error":"unauthorized","login":"/login"}';
    }

    # generated: one block per partition (front = bare paths, others /l/<slug>)
    include /etc/nginx/stack-locations/*.conf;

    # ---- hashed SPA assets: shared by every partition ---------------
    # One Angular build serves all partitions; the shell is injected with a
    # per-partition <base href>, and these root-absolute hashed bundles are
    # identical for everyone and carry no data, so they stay ungated and
    # immortal.
    location ~* ^/(?:main|chunk|polyfills|runtime|scripts)-[A-Za-z0-9_.]+\.js$ {
        root /var/www/drivepod;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* ^/(?:styles|Styles)-[A-Za-z0-9_.]+\.css$ {
        root /var/www/drivepod;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ ^/(?:favicon\.ico|manifest\.webmanifest|icons/|assets/) {
        root /var/www/drivepod;
        try_files $uri =404;
    }

    location = /robots.txt { root /var/www/hub; try_files $uri =404; }

    # Nothing matched, so there is no data here to show: the front partition's
    # SPA lives at /l/<front>/ like every other one (the portal root IS the
    # picker), and a mistyped /l/<slug> borrows nobody's partition.
    #
    # MUST be a location, never a bare `return 404;` at server level: nginx runs
    # a server-level return in the rewrite phase, BEFORE it looks up any
    # location, so a bare return makes every block above unreachable while the
    # server's own `add_header ... always` still stamps the 404 it produced - a
    # syntactically valid, completely dead gateway that `nginx -t` passes and
    # that answers 404 for its own healthcheck URL
    # (test_served_gateway_answers_its_own_routes).
    location / {
        return 404;
    }
}
