# SHOUTcast/Icecast stream framing: 1.0 chunked passthrough, zero buffering,
# and the icy-* headers DNAS/the VPS proxy need. Buffering a live stream at
# the gateway is what turns a radio into a 30-second delay.
proxy_http_version 1.0;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_connect_timeout 5s;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
chunked_transfer_encoding off;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Icy-MetaData 1;
proxy_pass_header icy-br;
proxy_pass_header icy-name;
proxy_pass_header icy-genre;
proxy_pass_header icy-url;
proxy_pass_header icy-pub;
proxy_pass_header icy-description;
proxy_pass_header icy-metaint;
proxy_pass_header Transfer-Encoding;
