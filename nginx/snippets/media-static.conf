# Partition media tree (cache/ + library/): mp3/webp are content-permanent -
# the tuner and harvest write each file once and rename it into place, so the
# per-file ETag (size+mtime) is exact and a 304 costs nothing. State files
# (index/progress/status json) churn during playback and revalidate by ETag;
# gen-conf gives those their own no-cache locations.
add_header Cache-Control "public, max-age=86400" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header Access-Control-Allow-Origin "*" always;
add_header X-Content-Type-Options "nosniff" always;
