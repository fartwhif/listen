# Platform-wide nginx settings (included at http level by Debian's nginx.conf,
# before 20-gateway.conf and before the generated conf.d/05-maps.conf).
#
# No resolver is configured on purpose: every upstream in this stack is a
# literal 127.0.0.1:port produced by platform/gen-conf.py, so nothing here
# depends on runtime name resolution.
server_tokens off;
client_body_timeout 60s;
send_timeout 60s;
keepalive_timeout 65s;
keepalive_requests 1000;

# Media tree file types come from Debian's /etc/nginx/mime.types, which the
# platform nginx.conf already includes: mp3 -> audio/mpeg, m4a -> audio/x-m4a,
# mp4 -> video/mp4, webp/jpeg/png/json all present. A `types { }` block here
# REPLACES the whole included table (nginx merges http-level blocks by
# replacement, not addition), so the pre-hub block both emitted eight
# "duplicate extension" warnings at start and made every extension the stack
# did not list by hand (.info, .txt, .vtt, .flac, .m4a) fall to
# application/octet-stream.
